name: Validate hub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pyyaml jsonschema
      - name: Validate connector entries (schema, source allowlist, pinning, typosquat, denylist)
        run: python scripts/validate.py
