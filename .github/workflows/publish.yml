name: Publish index

# Builds index.json (validation runs first) and publishes it to GitHub Pages:
#   https://<owner>.github.io/streamwright-hub/index.json
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pyyaml jsonschema
      - name: Build index.json (validates first)
        run: python scripts/build_index.py
      - name: Assemble site
        run: |
          mkdir -p public
          cp index.json public/index.json
          cp schema/connector.schema.json public/connector.schema.json
          # minimal landing page
          cat > public/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>StreamWright Hub</title>
          <style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;color:#1f2430}</style>
          <h1>StreamWright connector hub</h1>
          <p>Machine-readable index: <a href="index.json">index.json</a></p>
          <p>Add a connector by opening a PR with a file under <code>connectors/</code>.</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
